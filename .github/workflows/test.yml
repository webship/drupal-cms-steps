name: Test

on:
  push:
    branches: ['2.0.x']
  pull_request:
    branches: ['2.0.x']
  workflow_dispatch:

env:
  FORCE_COLOR: '1'
  LAUNCH_URL: http://drupal-cms-steps-site.ddev.site
  # Accounts the users registry in cucumber.js logs in as (see README, "Settings").
  DRUPAL_ADMIN_USER: admin
  DRUPAL_ADMIN_PASS: admin
  DRUPAL_EDITOR_USER: content_editor
  DRUPAL_EDITOR_PASS: content_editor
  DRUPAL_EDITOR_MAIL: content_editor@example.com
  DRUPAL_AUTHENTICATED_USER: authenticated
  DRUPAL_AUTHENTICATED_PASS: authenticated

jobs:
  cucumber:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The default: the Starter site template as the installer applies it.
          - name: Starter site template
            template: drupal_cms_starter
            package: ''
            recipes: ''
          # The Starter template with two add-on recipes applied on top, which is
          # what the recipe-gated scenarios (forms, search) run against.
          - name: Starter with the Forms and Search recipes
            template: drupal_cms_starter
            package: ''
            recipes: drupal_cms_forms,drupal_cms_search
          # A site template that is not part of drupal/cms: required with Composer
          # first, then applied by the installer like any other.
          - name: Blank site template
            template: drupal_cms_blank
            package: drupal/drupal_cms_blank
            recipes: ''
    env:
      DRUPAL_SITE_TEMPLATE: ${{ matrix.template }}
      DRUPAL_SITE_TEMPLATE_PACKAGE: ${{ matrix.package }}
      DRUPAL_CMS_RECIPES: ${{ matrix.recipes }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install and start DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          ddevDir: drupal

      - name: Scaffold the Drupal CMS codebase
        working-directory: drupal
        run: |
          ddev composer create-project drupal/cms --no-interaction --no-progress
          # The drupal/cms template scaffolds its own .ddev/config.yaml (no
          # project name, a DDEV version constraint). Put this project's name
          # back so the site keeps answering at $LAUNCH_URL, and drop the
          # constraint so an older DDEV release still runs it.
          sed -i '/ddev_version_constraint/d' .ddev/config.yaml
          ddev config --project-name=drupal-cms-steps-site --project-type=drupal --docroot=web
          # The scaffold also pins a database version that can differ from the one the first
          # start created the volume with; nothing is installed yet, so start over with the
          # configured one.
          ddev start -y --reset-database --omit-snapshot

      - name: Install the site template and the add-on recipes, seed the accounts
        run: bash drupal/install-site-template.sh

      - name: Confirm Drupal Canvas is installed
        working-directory: drupal
        run: ddev drush pm:list --status=enabled --type=module --format=list | grep -x canvas

      - name: Wait for the site to answer over its DDEV URL
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$LAUNCH_URL/user/login" || true)
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          echo "Site never settled to a clean 200 response" >&2
          exit 1

      - name: Check the step examples and feature steps against the definitions
        run: npm run test:examples

      - name: Run cucumber dry-run (no ambiguous/undefined steps across webship-js, the core pack and this pack)
        run: npm run test:dry

      - name: Run Drupal CMS step tests
        run: npm test

      - name: Show DDEV logs
        if: always()
        working-directory: drupal
        run: ddev logs || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-${{ strategy.job-index }}
          path: |
            tests/reports/
            screenshots/
          retention-days: 14
          if-no-files-found: ignore
